name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default token only reads the repo. Fork PRs get no secrets either way.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  # Every green push to main ships: pending D1 migrations first (the new code may need them), then the Worker.
  # Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit). The Worker's own secrets
  # (VAPID, Telegram) live in Cloudflare and survive a deploy.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy # one at a time, in order; never cancel a deploy halfway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npm run deploy
